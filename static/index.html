<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cérebro da Lu</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="chat">
    <header class="chat-header">
      <div class="perfil">
        <span class="avatar" aria-hidden="true">Lu</span>
        <span class="perfil-texto">
          <strong>Cérebro da Lu</strong>
          <small>assistente de compras</small>
        </span>
      </div>
      <nav class="painel-abas">
        <button id="catalogo-toggle" class="aba" type="button" aria-expanded="false">Catálogo</button>
        <button id="pedidos-toggle" class="aba" type="button" aria-expanded="false">Pedidos</button>
      </nav>
    </header>

    <div id="catalogo-panel" class="painel hidden">
      <div class="painel-filtros">
        <select id="catalogo-categoria" aria-label="Filtrar por categoria">
          <option value="">Todas as categorias</option>
        </select>
        <input id="catalogo-busca" type="search" placeholder="Buscar produto..." autocomplete="off">
        <button id="catalogo-comparar" class="botao-secundario" type="button" hidden>Comparar categoria</button>
        <span id="catalogo-contagem" class="painel-contagem"></span>
      </div>
      <div id="catalogo-lista" class="vitrine"></div>
    </div>

    <div id="pedidos-panel" class="painel hidden">
      <div class="painel-filtros">
        <button id="pedidos-atualizar" class="botao-secundario" type="button">Atualizar</button>
        <span id="pedidos-contagem" class="painel-contagem"></span>
      </div>
      <div id="pedidos-lista" class="cards"></div>
    </div>

    <main id="messages" class="messages" aria-live="polite"></main>

    <p id="conexao-aviso" class="conexao-aviso" role="status" hidden>
      Sem contato com o servidor. As atualizações de pedido voltam sozinhas quando a conexão retornar.
    </p>

    <div id="digitando" class="digitando" hidden>
      <span class="avatar avatar-pequeno" aria-hidden="true">Lu</span>
      <span class="digitando-balao">
        <span class="ponto"></span><span class="ponto"></span><span class="ponto"></span>
      </span>
    </div>

    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Mensagem" autocomplete="off" autofocus>
      <button id="chat-enviar" type="submit" aria-label="Enviar mensagem">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M3 20.5l18-8.5L3 3.5V10l12 2-12 2z" fill="currentColor"/>
        </svg>
      </button>
    </form>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
